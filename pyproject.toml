[project]
name = "cymbal_operations_agent"
version = "0.1.0"
description = "Cymbal Retail Operations Agent"
requires-python = ">=3.11, <3.14"
dependencies = [
    "google-adk>=2.3.0",
    "google-genai>=2.0.0",
    "google-cloud-aiplatform[evaluation]>=1.60.0",
    "pandas>=2.0.0",
    "google-cloud-bigquery>=3.25.0",
    "google-cloud-bigtable>=2.26.0",
    "google-cloud-bigquery-storage>=2.25.0",
    "google-cloud-storage>=2.14.0",
    "google-auth>=2.28.0",
    "mcp>=1.2.0,<2.0.0",
    "pyarrow>=15.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
eval = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
url = "https://pypi.org/simple"
default = true
